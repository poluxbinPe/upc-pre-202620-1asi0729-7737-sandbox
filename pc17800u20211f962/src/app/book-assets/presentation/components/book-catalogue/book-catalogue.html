<section class="book-catalogue" aria-labelledby="book-catalogue-title">
  <h1 id="book-catalogue-title" class="catalogue-title">{{ 'catalogue.title' | translate }}</h1>
  <app-book-category-selector [categories]="store.categories"
                              [selectedCategory]="store.currentCategory()"
                              (categorySelected)="onCategorySelected($event)"/>
  <div class="catalogue-content" aria-live="polite" [attr.aria-busy]="store.loading()">
    @if (store.loading()) {
      <mat-progress-spinner mode="indeterminate" diameter="48"
                            [attr.aria-label]="'catalogue.loading' | translate"/>
    } @else if (store.error()) {
      <p role="alert">{{ 'catalogue.error' | translate }}</p>
    } @else {
      <app-book-list [books]="store.currentCategoryBooks()"/>
    }
  </div>
</section>
