<mat-button-toggle-group [value]="currentLanguage()"
                         [attr.aria-label]="'language.selector' | translate"
                         name="language">
  @for (language of languages; track language) {
    <mat-button-toggle [value]="language"
                       [attr.aria-label]="'language.' + language | translate"
                       (change)="useLanguage(language)">
      {{ language.toUpperCase() }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
