<section class="series-catalogue" aria-labelledby="series-catalogue-title">
  <h1 id="series-catalogue-title">{{ 'catalogue.title' | translate }}</h1>
  <app-search-term-selector (searchTermSelected)="onSearchTermSelected($event)"
                            [searchTerms]="store.searchTerms"
                            [selectedSearchTerm]="store.currentSearchTerm()"/>
  <app-series-list [seriesList]="seriesList()"/>
</section>
